name: ziarat_ashura
description: "زیارت عاشورا - متن، ترجمه، صوت و شمارنده"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_native_splash: ^2.4.1
  audioplayers: ^6.1.0
  vibration: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash.png
    - assets/audio/samavati.mp3
    - assets/audio/alifani.mp3
    - assets/audio/mirdamad.mp3
    - assets/audio/hadadian.mp3
    - assets/audio/farahmand.mp3
  fonts:
    - family: QuranFont
      fonts:
        - asset: assets/fonts/QuranFont.ttf

flutter_native_splash:
  color: "#0B0B0B"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    icon_background_color: "#0B0B0B"
    color: "#0B0B0B"
  android: true
  ios: false
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
